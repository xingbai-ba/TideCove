<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TideCove 配置</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel2: #1b202b;
    --line: #262c39;
    --text: #e8ecf3;
    --muted: #8b93a3;
    --accent: #7c5cff;
    --accent2: #5b8cff;
    --ok: #3ddc97;
    --warn: #ffb020;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo {
    width: 44px; height: 44px; border-radius: 14px;
    object-fit: cover; display: block;
  }
  h1 { font-size: 21px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; color: var(--muted); margin: 0 0 14px; font-weight: 600; letter-spacing: .04em; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 9px;
  }
  .row .label { color: var(--muted); font-size: 12px; width: 62px; flex: 0 0 auto; }
  .row .val {
    flex: 1; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 13px; word-break: break-all; color: var(--text);
  }
  .row .val.dim { color: var(--muted); }
  .copy {
    flex: 0 0 auto; border: 0; border-radius: 9px; padding: 7px 12px;
    background: #2a3040; color: var(--text); font-size: 12px; cursor: pointer;
  }
  .copy:hover { background: #343c50; }
  .copy:active { transform: scale(.96); }
  .copy.done { background: #1f4a38; color: #8ef0c2; }

  .codebox {
    text-align: center; padding: 26px 16px 20px;
    background: linear-gradient(180deg, rgba(124,92,255,.10), transparent);
    border: 1px solid var(--line); border-radius: 16px;
  }
  .code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 46px; letter-spacing: 10px; font-weight: 700;
    color: #fff; text-shadow: 0 0 24px rgba(124,92,255,.5);
    margin: 6px 0 10px;
  }
  .code.expired { color: var(--muted); text-shadow: none; }
  .timer { font-size: 12px; color: var(--muted); min-height: 16px; }
  .timer.warn { color: var(--warn); }
  .btnrow { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 12px; padding: 11px 20px; font-size: 14px;
    font-weight: 600; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  .btn.ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
  .btn.danger { background: #4a1f28; color: #ff9d9d; border: 1px solid #5c2630; }
  .btn:active { transform: scale(.97); }

  .status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: center; gap: 9px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px rgba(61,220,151,.6); }
  .dot.warn { background: var(--warn); }
  .dot.err { background: var(--err); }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 13px; margin-left: auto; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: #22304a; color: #cfe0ff; padding: 11px 20px; border-radius: 12px;
    font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none;
    border: 1px solid #2f4066;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  a { color: var(--accent2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon-192.png" alt="TideCove">
    <div>
      <h1>TideCove 配置</h1>
      <div class="sub">电脑端控制台 · 每 3 秒自动刷新</div>
    </div>
  </header>

  <div class="card">
    <h2>服务器地址</h2>
    <div class="row">
      <span class="label">Tailscale</span>
      <span class="val" id="tailscaleUrl">—</span>
      <button class="copy" data-copy="tailscaleUrl">复制</button>
    </div>
    <div class="row">
      <span class="label">局域网</span>
      <span class="val dim" id="lanUrl">—</span>
      <button class="copy" data-copy="lanUrl">复制</button>
    </div>
    <div class="row">
      <span class="label">本机</span>
      <span class="val dim" id="localUrl">—</span>
      <button class="copy" data-copy="localUrl">复制</button>
    </div>
    <div class="hint">手机装 APK 后，第一次打开填「Tailscale」这个地址（手机也要装 Tailscale 并登录同一账号，重启不变）。没装 Tailscale 就用「局域网」地址，手机和电脑连同一个 Wi-Fi。</div>
  </div>

  <div class="card codebox">
    <h2 style="margin-bottom:6px">配对码</h2>
    <div class="code" id="code">------</div>
    <div class="timer" id="timer">—</div>
    <div class="btnrow">
      <button class="btn" id="copyCode">复制配对码</button>
      <button class="btn ghost" id="refresh">立即换一个</button>
    </div>
  </div>

  <div class="card">
    <h2>状态</h2>
    <div class="status">
      <div class="stat"><span class="dot" id="dotPair"></span><span class="k">绑定</span><span class="v" id="vPair">—</span></div>
      <div class="stat"><span class="dot" id="dotDsh"></span><span class="k">DSH</span><span class="v" id="vDsh">—</span></div>
      <div class="stat"><span class="dot" id="dotStream"></span><span class="k">事件流</span><span class="v" id="vStream">—</span></div>
      <div class="stat"><span class="dot" id="dotPub"></span><span class="k">Tailscale</span><span class="v" id="vPub">—</span></div>
    </div>
    <div class="hint" id="deviceHint"></div>
    <div class="btnrow" style="justify-content:flex-start;margin-top:14px">
      <button class="btn danger" id="unbind">解绑当前设备</button>
    </div>
  </div>

  <div class="hint" style="text-align:center">
    这个页面只对本机开放，公网访问会被拒绝。
  </div>
</div>

<div class="toast" id="toast">已复制</div>

<script>
const $ = (s) => document.querySelector(s);
let info = null;

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyText(text) {
  if (!text) return false;
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return true;
    } catch { return false; }
  }
}

document.querySelectorAll('.copy').forEach((btn) => {
  btn.onclick = async () => {
    const id = btn.dataset.copy;
    const val = info?.[id] || $('#' + id).textContent;
    if (await copyText(val)) {
      const old = btn.textContent;
      btn.textContent = '已复制';
      btn.classList.add('done');
      toast('已复制：' + val);
      setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1400);
    } else toast('复制失败，手动选中吧');
  };
});

$('#copyCode').onclick = async () => {
  if (!info || !info.pairCode) return toast('当前没有配对码（已绑定）');
  if (await copyText(info.pairCode)) toast('配对码已复制：' + info.pairCode);
  else toast('复制失败');
};

$('#refresh').onclick = async () => {
  await fetch('/api/admin/refresh-code', { method: 'POST' });
  await poll();
  toast('已生成新配对码');
};

$('#unbind').onclick = async () => {
  if (!confirm('确定解绑当前手机？解绑后需要重新输入配对码。')) return;
  const r = await fetch('/api/admin/unbind', { method: 'POST' });
  const d = await r.json().catch(() => ({}));
  if (d.ok) { await poll(); toast('已解绑'); }
  else toast('解绑失败：' + (d.error || r.status));
};

function setDot(id, state, text) {
  $('#' + id).className = 'dot ' + (state || '');
  $('#' + id.replace('dot', 'v')).textContent = text;
}

async function poll() {
  try {
    const r = await fetch('/api/admin/info', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    info = await r.json();
  } catch (e) {
    $('#code').textContent = '——';
    $('#timer').textContent = '连不上服务，确认 TideCove 还在跑';
    return;
  }

  $('#tailscaleUrl').textContent = info.tailscaleUrl || '（没检测到 Tailscale）';
  $('#tailscaleUrl').classList.toggle('dim', !info.tailscaleUrl);
  $('#lanUrl').textContent = info.lanUrl;
  $('#localUrl').textContent = info.localUrl;

  if (info.paired) {
    $('#code').textContent = '已绑定';
    $('#code').classList.add('expired');
    $('#timer').textContent = '解绑后才能给新手机配';
    $('#copyCode').disabled = true;
  } else if (info.pairCode) {
    $('#code').textContent = info.pairCode;
    $('#code').classList.remove('expired');
    $('#copyCode').disabled = false;
    $('#timer').textContent = '长期有效（配对成功或点「立即换一个」才会变）';
    $('#timer').className = 'timer';
  } else {
    $('#code').textContent = '------';
    $('#timer').textContent = '—';
  }

  setDot('dotPair', info.paired ? 'ok' : 'warn', info.paired ? '已绑定' : '未绑定');
  setDot('dotDsh', info.dshReady ? 'ok' : 'err', info.dshReady ? '就绪' : '未连接');
  setDot('dotStream', info.streamReady ? 'ok' : 'err', info.streamReady ? '在线' : '离线');
  setDot('dotPub', info.tailscaleUrl ? 'ok' : 'err', info.tailscaleUrl ? '在线' : '未连接');

  $('#deviceHint').textContent = info.paired
    ? ('当前设备：' + (info.deviceName || '未知') + '（' + new Date(info.pairedAt).toLocaleString('zh-CN', { hour12: false }) + ' 绑定）')
    : '还没有设备绑定。在手机 APK 里填上面的地址和配对码。';
}

poll();
setInterval(poll, 3000);

// 配对码倒计时本地走秒，避免等 3 秒跳一下
setInterval(() => {
  if (!info || info.paired || !info.pairCodeExpiresIn) return;
  info.pairCodeExpiresIn = Math.max(0, info.pairCodeExpiresIn - 1);
  const left = info.pairCodeExpiresIn;
  const m = Math.floor(left / 60), s = left % 60;
  $('#timer').textContent = '还有 ' + m + ' 分 ' + String(s).padStart(2, '0') + ' 秒（过期自动换）';
}, 1000);
</script>
</body>
</html>
