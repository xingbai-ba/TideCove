// ── 自定义表情（用户上传的图片）──
// dataURL -> Blob（WebView 里 fetch(data:) 会 Failed to fetch，改用 atob 手动解）
function dataUrlToBlob(dataUrl) {
  const parts = String(dataUrl || '').split(',');
  if (parts.length < 2) throw new Error('不是有效的 dataURL');
  const head = parts[0];
  const b64 = parts[1];
  const m = /data:([^;]+)/.exec(head);
  const mime = m ? m[1] : 'image/jpeg';
  const bin = atob(b64);
  const len = bin.length;
  const arr = new Uint8Array(len);
  for (let i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function compressToDataUrl(file, maxSide) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const side = maxSide || 200;
        const scale = Math.min(1, side / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        // JPEG 不支持透明，先铺白底
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        // 有损压缩：200px + JPEG 0.72，通常十几 KB
        resolve(cv.toDataURL('image/jpeg', 0.72));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('读图失败')); };
    img.src = url;
  });
}

(function initCustomStickers() {
  const grid = document.getElementById('stickerGrid');
  const panel = document.getElementById('emojiPanel');
  const fileInput = document.getElementById('stickerFile');
  if (!grid || !fileInput) return;

  function load() {
    try { return JSON.parse(localStorage.getItem('tidecove.stickers') || '[]'); } catch { return []; }
  }
  function save(list) {
    let ok = true;
    try { localStorage.setItem('tidecove.stickers', JSON.stringify(list)); }
    catch { ok = false; }
    // 同时备份到服务端：换域名、重装 App 之后还能找回来
    if (store.token) {
      api('/api/my-stickers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: store.token, items: list }),
      }).catch(() => {});
    }
    return ok;
  }
  async function pullStickers() {
    if (!store.token) return;
    try {
      const r = await api('/api/my-stickers?token=' + encodeURIComponent(store.token));
      const remote = r.items || [];
      const local = load();
      if (!local.length && remote.length) {
        try { localStorage.setItem('tidecove.stickers', JSON.stringify(remote)); } catch { /* ignore */ }
        render();
      } else if (local.length && !remote.length) {
        save(local); // 第一次升级：把本地已有的表情先推上去
      }
    } catch { /* 拉不到就用本地的 */ }
  }
  window.__pullStickers = pullStickers;
  function render() {
    const list = load();
    grid.innerHTML = list.map((d, i) => '<div class="sticker-item" data-i="' + i + '"><img src="' + d + '" alt=""></div>').join('')
      + '<div class="sticker-item add" id="addSticker"><span>+</span></div>';
  }

  grid.addEventListener('click', async (e) => {
    if (e.target.closest('#addSticker')) {
      // 用页面里固定的 input（动态创建的 input 在 WebView 里 onchange 不回来）
      pickMode = 'sticker';
      try { fileInput.value = ''; } catch { /* ignore */ }
      fileInput.click();
      return;
    }
    const item = e.target.closest('.sticker-item[data-i]');
    if (!item) return;
    const i = Number(item.getAttribute('data-i'));
    const dataUrl = load()[i];
    if (!dataUrl) return;
    try {
      const blob = dataUrlToBlob(dataUrl);
      pendingImageBlob = new File([blob], 'sticker.png', { type: blob.type || 'image/png' });
      pendingImage = dataUrl;
      pendingSticker = true;
      if (panel) panel.classList.remove('show');
      send();
    } catch (err) { renderMessage('ai', '表情发送失败：' + err.message); }
  });
  // 长按删除
  let pressTimer = null;
  grid.addEventListener('touchstart', (e) => {
    const item = e.target.closest('.sticker-item[data-i]');
    if (!item) return;
    pressTimer = setTimeout(() => {
      const i = Number(item.getAttribute('data-i'));
      const list = load();
      if (!list[i]) return;
      list.splice(i, 1);
      save(list);
      render();
    }, 700);
  }, { passive: true });
  const clearPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
  grid.addEventListener('touchend', clearPress);
  grid.addEventListener('touchmove', clearPress);

  // 兜底：有些 WebView 收到 Uri 但不触发 change，直接轮询 files
  let stickerPollBusy = false;
  setInterval(() => {
    if (stickerPollBusy) return;
    if (!fileInput.files || !fileInput.files.length) return;
    stickerPollBusy = true;
    const files = Array.from(fileInput.files);
    try { fileInput.value = ''; } catch { /* ignore */ }
    handleStickerFiles(files).finally(() => { stickerPollBusy = false; });
  }, 700);

  async function handleStickerFiles(files) {
    try {
      if (!files.length) { renderMessage('ai', '没读到图片，再试一次'); return; }
      const list = load();
      let added = 0;
      for (const f of files) {
        try { list.push(await compressToDataUrl(f, 200)); added += 1; }
        catch (err) { renderMessage('ai', '这张压缩失败了：' + (err && err.message ? err.message : err)); }
      }
      if (!added) return;
      if (!save(list)) { renderMessage('ai', '表情存不下了，先删几个旧的再试'); return; }
      render();
      renderMessage('ai', '加了 ' + added + ' 个表情');
    } catch (err) {
      renderMessage('ai', '添加失败：' + (err && err.message ? err.message : err));
    }
  }

  // 固定 input 的 onchange（带提示）
  fileInput.onchange = () => {
    setTimeout(async () => {
      try {
        const files = Array.from(fileInput.files || []);
        if (!files.length) { renderMessage('ai', '没读到图片，再试一次'); return; }
        const list = load();
        let added = 0;
        for (const f of files) {
          try { list.push(await compressToDataUrl(f, 200)); added += 1; }
          catch (err) { renderMessage('ai', '这张压缩失败了：' + (err && err.message ? err.message : err)); }
        }
        if (!added) return;
        if (!save(list)) { renderMessage('ai', '表情存不下了，先删几个旧的再试'); return; }
        render();
        renderMessage('ai', '加了 ' + added + ' 个表情');
      } catch (err) {
        renderMessage('ai', '添加失败：' + (err && err.message ? err.message : err));
      } finally {
        try { fileInput.value = ''; } catch { /* ignore */ }
      }
    }, 250);
  };

  // 拖拽到「+」号直接添加（电脑浏览器）
  grid.addEventListener('dragover', (e) => {
    if (e.target.closest('#addSticker')) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      e.target.closest('#addSticker').classList.add('drop-over');
    }
  });
  grid.addEventListener('dragleave', (e) => {
    const add = e.target.closest('#addSticker');
    if (add) add.classList.remove('drop-over');
  });
  grid.addEventListener('drop', async (e) => {
    const add = e.target.closest('#addSticker');
    if (!add) return;
    e.preventDefault();
    add.classList.remove('drop-over');
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter((f) => f.type && f.type.startsWith('image/'));
    if (!files.length) return;
    const list = load();
    for (const f of files) {
      try { list.push(await compressToDataUrl(f, 200)); } catch (err) { /* 跳过 */ }
    }
    if (!save(list)) { renderMessage('ai', '表情存不下了，先删几个旧的'); return; }
    render();
  });

  render();
})();

// ── 原生选图回调（Android 侧读 Uri 后注入 dataURL，绕过 input 的 change）──
let pickMode = 'image';       // 'image' | 'sticker' | 'avatar' | 'bg'
let avatarPickKey = null;     // 'me' | 'ai'
let avatarPickCb = null;

/** 换头像前调用：告诉原生回调这次选图是给头像用的 */
function beginAvatarPick(key, cb) {
  pickMode = 'avatar';
  avatarPickKey = key;
  avatarPickCb = cb || null;
}

/** 图片压到最长边 maxSide 的 JPEG dataURL（头像、背景图都用它） */
function shrinkImage(src, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => {
      try {
        const scale = Math.min(1, maxSide / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * scale));
        const h = Math.max(1, Math.round(im.height * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(im, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      } catch (e) { reject(e); }
    };
    im.onerror = () => reject(new Error('读图失败'));
    im.src = src;
  });
}

window.__onNativePick = async function (dataUrl) {
  try {
    // 换头像：直接进裁剪界面，不能当图片发出去
    if (pickMode === 'avatar') {
      const key = avatarPickKey || 'me';
      const cb = avatarPickCb;
      pickMode = 'image';
      avatarPickKey = null;
      avatarPickCb = null;
      openAvatarCrop(dataUrl, key, cb);
      return;
    }
    // 换聊天背景：进预览界面，同样不能当图片发出去
    if (pickMode === 'bg') {
      pickMode = 'image';
      let src = dataUrl;
      try { src = await shrinkImage(dataUrl, 1400, 0.82); } catch { /* 压不动用原图 */ }
      if (window.__openBgPreview) window.__openBgPreview(src);
      return;
    }
    const blob = dataUrlToBlob(dataUrl);
    if (pickMode === 'sticker') {
      const grid = document.getElementById('stickerGrid');
      const list = JSON.parse(localStorage.getItem('tidecove.stickers') || '[]');
      const compressed = await compressToDataUrl(new File([blob], 'sticker.png', { type: blob.type || 'image/jpeg' }), 200);
      list.push(compressed);
      try { localStorage.setItem('tidecove.stickers', JSON.stringify(list)); }
      catch (e) { renderMessage('ai', '表情存不下了，先删几个旧的再试'); return; }
      // 重新渲染表情栏
      if (grid) {
        grid.innerHTML = list.map((d, i) => '<div class="sticker-item" data-i="' + i + '"><img src="' + d + '" alt=""></div>').join('')
          + '<div class="sticker-item add" id="addSticker"><span>+</span></div>';
      }
    } else {
      // 图片发送：设预览 + 待上传
      pendingImageBlob = new File([blob], 'picked.jpg', { type: blob.type || 'image/jpeg' });
      pendingImage = dataUrl;
      const pv = document.getElementById('preview');
      const pi = document.getElementById('previewImg');
      if (pv && pi) { pi.src = dataUrl; pv.style.display = 'block'; }
      setSendEnabled(true);
    }
  } catch (err) {
    renderMessage('ai', '处理图片失败：' + (err && err.message ? err.message : err));
  }
};

// ── 主页 ──
(function initProfile() {
  const page = document.getElementById('profilePage');
  const close = document.getElementById('ppClose');
  const hdr = document.getElementById('hdrAvatar');
  if (!page || !hdr) return;
  hdr.onclick = () => { page.classList.add('show'); paintProfile(); };
  if (close) close.onclick = () => page.classList.remove('show');

  const tabs = page.querySelectorAll('.pp-tab');
  tabs.forEach((tab) => {
    tab.onclick = () => {
      tabs.forEach((x) => x.classList.remove('on'));
      tab.classList.add('on');
      const which = tab.dataset.ptab;
      page.querySelectorAll('.pp-page').forEach((pg) => { pg.hidden = pg.id !== 'pp-' + which; });
      if (which === 'diary') {
        // 预加载过就直接显示；无论哪种，都按当前昵称重画一遍
        if (!diaryInited) loadDiary(true);
        else renderDiary();
      }
    };
  });

  const avView = document.getElementById('ppAvatar');
  const nickView = document.getElementById('ppNick');
  function paintProfile() {
    const s = loadSettings();
    const label = s.meNick || '主人';
    if (avView) {
      if (s.meAvatar) avView.innerHTML = '<img src="' + s.meAvatar + '" alt="">';
      else avView.textContent = label.slice(0, 1);
    }
    if (nickView) nickView.textContent = label;
  }
  window.__paintProfile = paintProfile;

  const avBtn = document.getElementById('ppAvatarBtn');
  const avFile = document.getElementById('ppAvatarFile');
  if (avBtn && avFile) {
    avBtn.onclick = () => {
      beginAvatarPick('me', paintProfile);
      avFile.click();
    };
    avFile.onchange = () => {
      const f = avFile.files && avFile.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => openAvatarCrop(r.result, 'me', paintProfile, avFile);
      r.readAsDataURL(f);
      avFile.value = '';
    };
  }

  const nickInput = document.getElementById('ppNickInput');
  if (nickInput) {
    nickInput.value = loadSettings().meNick || '';
    nickInput.oninput = () => {
      saveSettings({ meNick: nickInput.value.trim() });
      applySettings();
      paintProfile();
    };
  }

  const size = document.getElementById('ppSize');
  const sizeLabel = document.getElementById('ppSizeLabel');
  if (size && sizeLabel) {
    size.value = loadSettings().meSize || 15;
    sizeLabel.textContent = size.value;
    size.oninput = () => {
      sizeLabel.textContent = size.value;
      saveSettings({ meSize: Number(size.value) });
      applySettings();
    };
  }

  // 日间 / 夜间切换
  const schemeEl = document.getElementById('ppScheme');
  if (schemeEl) {
    const paintScheme = () => {
      const cur = loadSettings().scheme === 'light' ? 'light' : 'dark';
      schemeEl.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.scheme === cur));
    };
    schemeEl.querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        saveSettings({ scheme: b.dataset.scheme });
        applySettings();
        paintScheme();
      };
    });
    paintScheme();
  }

  const colors = document.getElementById('ppColors');
  if (colors) {
    const cur = loadSettings().meColor || '#6d4dfa';
    COLORS.forEach((c) => {
      const d = document.createElement('div');
      d.className = 'color-dot' + (cur === c ? ' on' : '');
      d.style.background = c;
      d.onclick = () => {
        saveSettings({ meColor: c });
        colors.querySelectorAll('.color-dot').forEach((x) => x.classList.remove('on'));
        d.classList.add('on');
        applySettings();
      };
      colors.appendChild(d);
    });
  }

  // 主题配色（全局）：换色后按钮、图标、输入框、选中态、头部光晕一起变
  const themesEl = document.getElementById('ppThemes');
  if (themesEl) {
    const curTheme = loadSettings().theme || 'purple';
    THEMES.forEach((th2) => {
      const d = document.createElement('div');
      d.className = 'theme-dot' + (curTheme === th2.id ? ' on' : '');
      d.dataset.theme = th2.id;
      d.style.background = 'linear-gradient(135deg,' + th2.c1 + ',' + th2.c2 + ')';
      d.onclick = () => {
        saveSettings({ theme: th2.id });
        applySettings();
        syncSettingsUI();
      };
      themesEl.appendChild(d);
    });
  }

  // ── 日记 ──
  const diaryListEl = document.getElementById('diaryList');
  const diaryInputEl = document.getElementById('diaryInput');
  const diarySendEl = document.getElementById('diarySendBtn');
  const diaryDateEl = document.getElementById('diaryDate');

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayLabel(ds) {
    const p = String(ds || '').split('-');
    if (p.length !== 3) return String(ds || '');
    const head = p[0] + ' 年 ' + Number(p[1]) + ' 月 ' + Number(p[2]) + ' 日';
    return ds === todayKey() ? head + ' · 今天' : head;
  }
  if (diaryDateEl) diaryDateEl.textContent = dayLabel(todayKey());

  // 日记：先只拉最新 3 条，点开立刻能看；往下翻再续，不用一次全拉
  const DIARY_PAGE = 3;
  let diaryItems = [];       // 新 → 老
  let diaryHasMore = true;
  let diaryOldestTs = 0;
  let diaryLoading = false;
  let diaryInited = false;
  let diaryEditingTs = 0;

  function renderDiary() {
    if (!diaryListEl) return;
    if (!diaryItems.length) {
      diaryListEl.innerHTML = '<div class="pp-empty">还没有日记，今天想写点什么？</div>';
      return;
    }
    const groups = [];
    const idx = new Map();
    for (const it of diaryItems) {
      const key = it.date || todayKey();
      if (!idx.has(key)) { idx.set(key, groups.length); groups.push({ day: key, list: [] }); }
      groups[idx.get(key)].list.push(it);
    }
    diaryListEl.innerHTML = groups.map((g) =>
      '<div class="diary-item"><div class="diary-day">' + esc(dayLabel(g.day)) + '</div>'
      + g.list.map((it) => {
          const ts = Number(it.ts) || 0;
          if (ts && ts === diaryEditingTs) {
            return '<div class="diary-text editing">'
              + '<textarea class="dedit" data-ts="' + ts + '">' + esc(it.text) + '</textarea>'
              + '<div class="dedit-btns">'
              + '<button class="dbtn" data-act="cancel">取消</button>'
              + '<button class="dbtn primary" data-act="save" data-ts="' + ts + '">保存</button>'
              + '</div></div>';
          }
          return '<div class="diary-text">'
            + (it.who === 'ai' ? '<span class="diary-who">' + esc(aiDisplayName(it.ai || 'dsh')) + '</span>' : '')
            + '<span class="dtxt">' + esc(it.text) + '</span>'
            + '<span class="dact">'
            + '<button class="dbtn" data-act="edit" data-ts="' + ts + '" title="编辑" aria-label="编辑">'
            + '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
            + '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>'
            + '</svg></button>'
            + '<button class="dbtn" data-act="del" data-ts="' + ts + '" title="删除" aria-label="删除">'
            + '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
            + '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>'
            + '<path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'
            + '</svg></button>'
            + '</span></div>';
        }).join('')
      + '</div>'
    ).join('') + (diaryHasMore ? '<div class="pp-empty">往下翻继续加载…</div>' : '');
  }

  async function loadDiary(reset) {
    if (!diaryListEl || !store.token) return;
    if (diaryLoading) return;
    if (!reset && !diaryHasMore) return;
    diaryLoading = true;
    try {
      const q = reset
        ? ('&limit=' + DIARY_PAGE)
        : ('&limit=' + (DIARY_PAGE * 4) + '&before=' + diaryOldestTs);
      const r = await api('/api/diary?token=' + encodeURIComponent(store.token) + q);
      const items = (r.items || []).slice().reverse();   // 服务端升序 → 前端降序（新在上）
      diaryHasMore = Boolean(r.hasMore);
      diaryItems = reset ? items : diaryItems.concat(items);
      if (diaryItems.length) diaryOldestTs = Number(diaryItems[diaryItems.length - 1].ts || 0);
      diaryInited = true;
      renderDiary();
    } catch (e) {
      if (!diaryInited) diaryListEl.innerHTML = '<div class="pp-empty">加载失败：' + esc(e.message || '网络错误') + '</div>';
    } finally {
      diaryLoading = false;
    }
  }

  // 往下翻接近底部就续下一页
  const ppBodyEl = document.querySelector('.pp-body');
  if (ppBodyEl) {
    ppBodyEl.addEventListener('scroll', () => {
      const pg = document.getElementById('pp-diary');
      if (!pg || pg.hidden) return;
      if (ppBodyEl.scrollTop + ppBodyEl.clientHeight >= ppBodyEl.scrollHeight - 120) loadDiary(false);
    }, { passive: true });
  }

  // 日记的改 / 删 / 存
  if (diaryListEl) {
    diaryListEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('.dbtn');
      if (!btn) return;
      const act = btn.dataset.act;
      const ts = Number(btn.dataset.ts || 0);

      if (act === 'edit') { diaryEditingTs = ts; renderDiary(); return; }
      if (act === 'cancel') { diaryEditingTs = 0; renderDiary(); return; }

      if (act === 'save') {
        const ta = diaryListEl.querySelector('textarea.dedit[data-ts="' + ts + '"]');
        const text = ta ? ta.value.trim() : '';
        if (!text) return;
        btn.disabled = true;
        try {
          await api('/api/diary/update', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: store.token, ts: ts, text: text }),
          });
          const it = diaryItems.find((x) => Number(x.ts) === ts);
          if (it) it.text = text;
          diaryEditingTs = 0;
          renderDiary();
        } catch (err) {
          alert('改不了：' + (err.message || '网络错误'));
          btn.disabled = false;
        }
        return;
      }

      if (act === 'del') {
        if (!confirm('删掉这篇日记？删了就找不回来了。')) return;
        try {
          await api('/api/diary/delete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: store.token, ts: ts }),
          });
          diaryItems = diaryItems.filter((x) => Number(x.ts) !== ts);
          renderDiary();
        } catch (err) {
          alert('删不掉：' + (err.message || '网络错误'));
        }
      }
    });
  }

  async function publishDiary() {
    if (!diarySendEl) return;
    const text = diaryInputEl ? diaryInputEl.value.trim() : '';
    if (!text) return;
    diarySendEl.disabled = true;
    diarySendEl.textContent = '写入中…';
    try {
      await api('/api/diary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: store.token, text: text, date: todayKey() }),
      });
      if (diaryInputEl) diaryInputEl.value = '';
      await loadDiary(true);
    } catch (e) {
      alert('写入失败：' + (e.message || '网络错误'));
    } finally {
      diarySendEl.disabled = false;
      diarySendEl.textContent = '写进日记';
    }
  }
  if (diarySendEl) diarySendEl.onclick = publishDiary;
  window.__loadDiary = (reset) => loadDiary(reset !== false);
  window.__renderDiary = renderDiary;

  paintProfile();

  // ── 群聊里的 @ 提及 ──
  (function initMention() {
    const ta = document.getElementById('input');
    if (!ta) return;
    const box = document.createElement('div');
    box.id = 'mentionBox';
    box.style.cssText = 'position:fixed;z-index:80;display:none;background:rgba(18,26,44,.97);border:1px solid rgba(120,170,240,.32);border-radius:10px;padding:6px;min-width:150px;box-shadow:0 10px 28px rgba(0,0,0,.55);backdrop-filter:blur(8px)';
    document.body.appendChild(box);
    const NAMES = ['DeepSeek', 'Claude', 'ChatGPT', 'Kimi', 'Gemini'];
    function hide() { box.style.display = 'none'; }
    function show() {
      box.innerHTML = NAMES.map(function (n) {
        return '<div data-name="' + n + '" style="padding:7px 12px;font-size:13px;color:#cfe4ff;cursor:pointer;border-radius:6px">@' + n + '</div>';
      }).join('');
      box.querySelectorAll('div').forEach(function (el) {
        el.onmouseenter = function () { el.style.background = 'rgba(70,130,220,.28)'; };
        el.onmouseleave = function () { el.style.background = 'transparent'; };
      });
      const r = ta.getBoundingClientRect();
      box.style.left = r.left + 'px';
      box.style.top = (r.top - 6) + 'px';
      box.style.transform = 'translateY(-100%)';
      box.style.display = 'block';
    }
    ta.addEventListener('input', function () {
      if (curAi !== 'all') { hide(); return; }
      const pos = ta.selectionStart || 0;
      const before = ta.value.slice(0, pos);
      if (/@[^\s@]{0,6}$/.test(before)) show(); else hide();
    });
    box.addEventListener('click', function (e) {
      const it = e.target.closest('div[data-name]');
      if (!it) return;
      const name = it.getAttribute('data-name');
      const pos = ta.selectionStart || ta.value.length;
      const before = ta.value.slice(0, pos);
      const at = before.lastIndexOf('@');
      if (at >= 0) {
        ta.value = ta.value.slice(0, at) + '@' + name + ' ' + ta.value.slice(pos);
        const np = at + name.length + 2;
        ta.setSelectionRange(np, np);
      }
      hide();
      ta.focus();
    });
    document.addEventListener('click', function (e) {
      if (!box.contains(e.target) && e.target !== ta) hide();
    });
  })();
})();
</script>
