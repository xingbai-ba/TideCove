<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TideCove</title>
<link rel="manifest" href="/manifest.json">
<style>
  :root {
    --bg: #16141e;
    --panel: #1d1b27;
    --panel-2: #262333;
    --line: #353246;
    --text: #eceaf2;
    --muted: #9b96ad;
    --accent: #8b7cf7;
    --accent-2: #b4a7ff;
    --accent-rgb: 139, 124, 247;
    --accent-2-rgb: 180, 167, 255;
    --bubble-me: #8b7cf7;
    --bubble-ai: #262333;
    --edge: rgba(255,255,255,.08);
    --danger: #ff7a7a;
    --shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  /* 日夜切换时颜色平滑过渡，别硬切 */
  body, header, footer, #profilePage, .pp-body, #chat, #input, #preview,
  .diary-item, .pp-compose, .modal-card, .set-row, .pp-row input, .pp-avatar-btn {
    transition: background-color .38s ease, color .38s ease, border-color .38s ease;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }
  header {
    flex: 0 0 auto; padding: 12px 14px 12px 16px;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--edge);
    display: flex; align-items: center; gap: 11px;
    padding-top: calc(12px + env(safe-area-inset-top));
    position: relative; z-index: 5;
  }
  header .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 16px; flex: 0 0 auto;
    margin-right: 0; box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .22);
  }
  header .name { font-weight: 650; font-size: 16px; letter-spacing: .2px; }
  header .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; margin-left: auto; box-shadow: 0 0 0 3px rgba(61,220,151,.16); transition: background .3s, box-shadow .3s; }
  header .dot.off { background: #ff6b6b; box-shadow: 0 0 0 3px rgba(255,107,107,.16); }
  header .dot.wait { background: #ffb020; box-shadow: 0 0 0 3px rgba(255,176,32,.16); animation: pulse 1.4s infinite; }
  header .icon-btn { background: transparent; color: var(--muted); width: 38px; height: 38px; border-radius: 50%; font-size: 19px; }
  header .icon-btn:active { background: var(--panel-2); color: var(--text); }
  .icon-btn { background: none; border: none; color: var(--accent); cursor: pointer; padding: 2px 4px; line-height: 0; display: flex; align-items: center; }
  .icon-btn svg { display: block; }
  #profilePage {
    position: fixed; inset: 0; z-index: 180;
    background: var(--bg);
    transform: translateX(-100%);
    transition: transform .28s cubic-bezier(.16,1,.3,1);
    display: flex; flex-direction: column;
  }
  #profilePage.show { transform: none; }
  .pp-head { display: flex; align-items: center; gap: 12px; padding: calc(18px + env(safe-area-inset-top)) 16px 14px; }
  .pp-avatar {
    width: 58px; height: 58px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(135deg,#8b5cf6,#ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff; flex: 0 0 58px;
  }
  .pp-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pp-nick { font-size: 19px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pp-tabs { display: flex; gap: 4px; margin: 0 16px 14px; padding: 4px; background: var(--panel-2); border-radius: 14px; }
  .pp-tab {
    flex: 1; padding: 8px 0; border-radius: 10px; cursor: pointer;
    border: 0; background: transparent; font-family: inherit;
    color: var(--muted); font-size: 14px; transition: background-color .2s, color .2s;
  }
  .pp-tab.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .pp-body { flex: 1; overflow-y: auto; padding: 0 16px 40px; }
  .pp-row { margin-bottom: 16px; }
  .pp-row > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .pp-row input[type=text] {
    width: 100%; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-size: 14px; box-sizing: border-box;
  }
  .pp-row input[type=range] { width: 100%; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 9px 0; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    font-size: 13px; font-family: inherit;
  }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pp-avatar-btn {
    display: inline-block; padding: 7px 14px; border-radius: 10px;
    border: 1px dashed var(--line); color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .pp-compose {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 14px;
  }
  .pp-compose textarea {
    width: 100%; box-sizing: border-box; resize: none;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; font-size: 14px; font-family: inherit; outline: none;
  }
  .pp-compose-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .pp-page { padding-top: 4px; }

  /* ── 日记 ── */
  .diary-item {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px; margin-bottom: 10px;
  }
  .pp-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 26px 0; }
  .pp-diary-date { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .diary-day { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .diary-text {
    position: relative; padding-right: 58px;
    font-size: 14px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .diary-text.editing { padding-right: 0; }
  .dact { position: absolute; right: 0; top: 0; display: flex; gap: 10px; }
  .dbtn {
    background: none; border: 0; padding: 3px; cursor: pointer; line-height: 0;
    color: var(--muted); font-size: 12px; font-family: inherit;
    display: flex; align-items: center;
  }
  .dbtn svg { display: block; }
  .dbtn:active { color: var(--accent); }
  .dbtn.primary { color: var(--accent); font-weight: 600; line-height: 1.4; }
  .dedit {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 70px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; font-family: inherit; outline: none;
  }
  .dedit-btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 6px; }
  .diary-who {
    display: inline-block; font-size: 11px; line-height: 1.5;
    padding: 1px 8px; border-radius: 999px; margin-right: 6px;
    background: var(--accent); color: #fff; vertical-align: 1px;
  }
  .diary-text + .diary-text { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }

  #imgViewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 300;
    display: none; align-items: center; justify-content: center;
  }
  #imgViewer.show { display: flex; }
  #imgViewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #imgViewerClose {
    position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 20px;
    color: #fff; font-size: 26px; cursor: pointer; opacity: .8; line-height: 1;
  }
  #imgViewerSave {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(28px + env(safe-area-inset-bottom));
    padding: 11px 30px; border: 0; border-radius: 999px;
    background: rgba(255,255,255,.18); color: #fff; font-size: 15px; font-weight: 600;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    cursor: pointer; letter-spacing: .5px;
  }
  #imgViewerSave:active { background: rgba(255,255,255,.32); transform: translateX(-50%) scale(.97); }
  #imgViewerSave[disabled] { opacity: .55; }
  #tcToast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    background: rgba(22,22,32,.94); color: #fff; font-size: 14px; line-height: 1.45;
    padding: 11px 20px; border-radius: 14px; z-index: 999; max-width: 80vw; text-align: center;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  #tcToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .ai-btn {
    background: rgba(var(--accent-rgb), .14); color: var(--accent-2);
    border: 1px solid rgba(var(--accent-rgb), .28); border-radius: 999px;
    padding: 5px 13px; font-size: 12.5px; font-weight: 600; margin-left: auto;
    max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: inherit; cursor: pointer;
  }
  .ai-btn:active { background: rgba(var(--accent-rgb), .26); }
  header .dot { margin-left: 8px; }
  #aiPanel {
    position: fixed; right: 12px; top: calc(62px + env(safe-area-inset-top));
    width: 220px; max-height: 60vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 16px; padding: 10px; display: none; z-index: 95;
    box-shadow: 0 16px 40px rgba(0,0,0,.35);
  }
  #aiPanel.show { display: block; animation: bubbleGrow .2s cubic-bezier(.16,1,.3,1) both; transform-origin: right top; }
  .ai-item {
    display: flex; align-items: center; gap: 6px; padding: 9px 10px;
    border-radius: 10px; font-size: 14px; cursor: pointer; color: var(--text);
  }
  .ai-item:active { background: var(--panel-2); }
  .ai-item.on { background: rgba(var(--accent-rgb), .16); color: var(--accent-2); }
  .ai-item.dim { opacity: .5; }
  .ai-item .st { margin-left: auto; font-size: 10.5px; color: var(--muted); max-width: 96px; text-align: right; }
  .ai-item .st.off { color: #ff8a8a; }
  .ai-item .st.idle { color: #ffb020; }
  .ai-item .st.on { color: #3ddc97; }
  #emojiPanel {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(112px + env(safe-area-inset-bottom));
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 20px; padding: 12px; display: none; z-index: 90;
    max-height: 260px; overflow-y: auto;
    box-shadow: 0 16px 40px rgba(0,0,0,.35);
  }
  #emojiPanel.show { display: block; animation: bubbleGrow .26s cubic-bezier(.16,1,.3,1) both; transform-origin: left bottom; }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .emoji-item { font-size: 23px; text-align: center; padding: 5px 0; cursor: pointer; border-radius: 8px; user-select: none; }
  .panel-label { font-size: 11px; color: var(--muted); margin: 4px 2px 6px; }
  .sticker-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 10px; }
  .sticker-item {
    aspect-ratio: 1; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 3px; user-select: none;
  }
  .sticker-item:active { background: var(--panel-2); }
  .sticker-item img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .sticker-item.add {
    border: 1.5px dashed var(--line); color: var(--muted);
    font-size: 26px; font-weight: 300; background: transparent;
  }
  .sticker-item.add:active { background: var(--panel-2); }
  .sticker-item.add.drop-over {
    border-color: var(--accent); color: var(--accent);
    background: rgba(var(--accent-rgb), .12);
  }
  .emoji-item:active { background: var(--panel-2); }
  .icon-btn:active { opacity: .6; }
  #settingsModal {
    position: fixed; inset: 0; background: rgba(0,0,0,.62);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px; backdrop-filter: blur(3px);
  }
  #settingsModal.show { display: flex; }
  .modal-card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 24px; padding: 24px;
    width: 100%; max-width: 340px; max-height: 82vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: msgIn .35s cubic-bezier(.16,1,.3,1) both;
  }
  .modal-card h3 { margin: 0 0 16px; font-size: 17px; }
  .set-row { margin-bottom: 15px; }
  .set-row > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .set-row input[type=text] {
    width: 100%; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-size: 14px; box-sizing: border-box;
  }
  .set-row input[type=file] { font-size: 12px; color: var(--muted); }
  .themes { display: flex; gap: 10px; }
  .theme-dot {
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color .2s;
  }
  .theme-dot.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .set-ver { text-align: center; font-size: 11px; color: var(--muted); margin-top: 18px; letter-spacing: .5px; }
  .profile { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .colors { display: flex; flex-wrap: wrap; gap: 9px; }
  .color-dot {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color .18s, transform .18s;
  }
  .color-dot.on { border-color: var(--accent); transform: scale(1.08); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .ghost-btn {
    padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(var(--accent-rgb), .55);
    background: rgba(var(--accent-rgb), .10); color: var(--accent); font-size: 13px;
    cursor: pointer; margin: 2px 8px 2px 0;
  }
  .ghost-btn:active { opacity: .65; }
  .primary-btn {
    padding: 9px 20px; border-radius: 10px; border: 0;
    background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
  }
  #avatarPreview {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 210;
    display: none; touch-action: none;
  }
  #avatarPreview.show { display: block; }
  .av-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .av-circle {
    width: 240px; height: 240px; border-radius: 50%; overflow: hidden;
    position: relative; box-shadow: 0 0 0 9999px rgba(0,0,0,.72);
  }
  .av-circle img {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(1);
    max-width: none; user-select: none; -webkit-user-drag: none;
    will-change: transform, left, top;
  }
  .av-tip {
    position: absolute; top: calc(22px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.72); color: #fff; font-size: 12px;
    padding: 8px 16px; border-radius: 20px; white-space: nowrap;
  }
  .av-actions {
    position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px;
  }
  #bgPreview {
    position: fixed; inset: 0; background: transparent; z-index: 200;
    display: none; touch-action: none;
  }
  #bgPreview.show { display: block; }
  .bg-tip {
    position: absolute; top: calc(18px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.72); color: #fff; font-size: 12px;
    padding: 8px 16px; border-radius: 20px; white-space: nowrap;
    backdrop-filter: blur(6px);
  }
  .bg-stage { position: absolute; inset: 0; }
  .bg-stage img { display: none; }
  .bg-actions {
    position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
  }
  .bg-actions .ghost-btn, .bg-actions .primary-btn {
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .tab {
    flex: 1; padding: 9px 0; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); font-size: 14px; transition: all .18s;
  }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .set-avatar {
    width: 76px; height: 76px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #fff; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: transform .18s;
  }
  .set-avatar:active { transform: scale(.94); }
  .set-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .set-nick {
    font-size: 16px; font-weight: 600; cursor: pointer;
    padding: 5px 14px; border-radius: 9px; transition: background .18s;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .set-nick:active { background: var(--panel-2); }
  .set-nick-edit {
    font-size: 16px; font-weight: 600; text-align: center;
    width: 150px; padding: 6px 10px; border-radius: 9px;
    border: 1px solid var(--accent); background: var(--panel-2);
    color: var(--text); box-sizing: border-box; outline: none;
  }
  .bubble { font-size: var(--size-me, 15px); }
  /* 只有图片/表情的气泡：不要边框、不要底色、不要内边距 */
  .bubble:has(> .imgwrap):not(:has(> audio)) {
    background: transparent !important;
    background-image: none !important;
    box-shadow: none !important;
    border: none !important;
    padding: 0 !important;
  }
  .msg.me .bubble:has(> .imgwrap) { background: transparent !important; }
  .msg-name { font-size: 11px; color: var(--muted); margin: 0 0 4px 0; letter-spacing: .04em; opacity: .85; }
  .msg.ai .bubble { font-size: var(--size-ai, 15px); }
  .msg.me .bubble { font-size: var(--size-me, 15px); }

  #splash {
    position: fixed; inset: 0; z-index: 150;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--bg); transition: opacity .3s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-spin {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .splash-text { font-size: 13px; color: var(--muted); }
  #login { flex: 1; display: grid; place-items: center; padding: 24px; }
  .card {
    width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 24px; padding: 30px 24px 24px;
    box-shadow: var(--shadow);
  }
  .card h1 { font-size: 21px; margin: 0 0 8px; letter-spacing: .3px; }
  .card p { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 0 0 18px; }
  .code-input {
    width: 100%; font-size: 30px; letter-spacing: 12px; text-align: center;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 10px; outline: none; font-family: ui-monospace, monospace;
  }
  .code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .16); }
  .btn {
    width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }
  .hint.err { color: var(--danger); }

  #chat {
    flex: 1; overflow-y: auto; padding: 18px 14px 10px; scroll-behavior: auto;
    scrollbar-width: none; overscroll-behavior: contain;
  }
  #chat::-webkit-scrollbar { display: none; }
  @keyframes msgIn {
  0%   { opacity: 0; transform: translateY(18px) scale(.94); }
  55%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.msg { display: flex; align-items: flex-start; margin-bottom: 14px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  flex: 0 0 36px; margin-right: 9px;
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #fff; user-select: none;
  background: linear-gradient(135deg, #5eb8ff, #7c8cff);
  box-shadow: 0 0 0 1px var(--edge), 0 2px 8px rgba(0,0,0,.18);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg.me { justify-content: flex-end; }
.msg.me .bubble { order: 1; }
.msg.me .avatar { order: 2; margin-right: 0; margin-left: 9px; background: linear-gradient(135deg, var(--accent), #f29bd0); }
.msg.anim { animation: msgIn .52s cubic-bezier(.16,1,.3,1) both; will-change: transform, opacity; }
  @keyframes bubbleGrow {
    0%   { opacity: 0; transform: scale(.88); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
  }
  .bubble.grow { animation: bubbleGrow .38s cubic-bezier(.16,1,.3,1) both; transform-origin: left top; }

  .msg.me .bubble.grow { transform-origin: right top; }
  .voice {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 2px; padding: 0;
    background: none; border: 0; cursor: pointer; user-select: none;
    min-width: 96px;
  }
  .vtext { margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
  .vplay {
    width: 18px; height: 18px; border-radius: 50%; flex: 0 0 18px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .vplay svg { width: 11px; height: 11px; }
  .vplay.playing { background: var(--accent-2, var(--accent)); }
  .vbar { flex: 1; height: 2px; border-radius: 2px; background: rgba(255,255,255,.22); overflow: hidden; min-width: 40px; }
  .vbar i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .1s linear; }
  .vdur { font-size: 11px; color: rgba(255,255,255,.7); min-width: 26px; text-align: right; }
  .vmenu {
    position: fixed; z-index: 260;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); overflow: hidden;
  }
  .vmenu button {
    display: block; width: 100%; padding: 9px 16px; border: 0; background: none;
    color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .vmenu button:active { background: rgba(var(--accent-rgb), .16); }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 20px;
    font-size: 15px; line-height: 1.6; word-break: break-word; white-space: pre-wrap;
    letter-spacing: .15px;
    /* 气泡底色是深色/彩色，文字固定白色，日间模式下才不会变成深字看不清 */
    color: #fff;
  }
  .msg.me .bubble {
    background: var(--bubble-me);
    background-image: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,0) 60%);
    border-top-right-radius: 6px;
    box-shadow: 0 4px 14px rgba(var(--accent-rgb), .22);
  }
  .msg-name { font-size: 11px; color: var(--muted); margin: 0 0 4px 0; letter-spacing: .04em; opacity: .85; }
  .msg.ai .bubble {
    background: var(--bubble-ai); border: 1px solid var(--edge);
    border-top-left-radius: 6px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .bubble img { max-width: 100%; border-radius: 10px; display: block; }
  .imgwrap {
    position: relative; display: inline-block; margin-top: 6px;
    min-width: 140px; min-height: 100px;
    border-radius: 10px; background: var(--panel-2);
  }
  .imgwrap .imgload {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    border-radius: 10px; background: var(--panel-2);
  }
  .imgwrap.ok .imgload { display: none; }
  .imgwrap.ok { min-width: 0; min-height: 0; background: transparent; }
  .imgwrap.sticker-img { min-width: 0; min-height: 0; }
  .imgwrap.sticker-img img { max-width: 132px; max-height: 132px; width: auto; height: auto; }
  .imgwrap.sticker-img .imgload { display: none; }
  .imgwrap img { display: block; max-width: 100%; border-radius: 10px; }
  .imgwrap .uploading {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.38); border-radius: 10px;
  }
  .imgwrap .spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .imgwrap.failed::after {
    content: '上传失败'; position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(120,20,30,.55); border-radius: 10px; font-size: 12px; color: #ffd0d0;
  }
  .bubble audio { margin-top: 6px; width: 220px; max-width: 100%; }
  .meta { font-size: 10.5px; color: var(--muted); opacity: .75; margin-top: 5px; text-align: right; font-variant-numeric: tabular-nums; }
  .msg.ai .meta { text-align: left; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }

  footer {
    flex: 0 0 auto; padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
    border-top: 1px solid var(--edge);
    display: flex; flex-direction: column; gap: 8px;
  }
  .bar-top { display: flex; gap: 4px; }
  .bar-bottom { display: flex; align-items: flex-end; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; flex: 0 0 auto; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); font-size: 18px;
    display: grid; place-items: center; cursor: pointer;
    transition: background-color .18s, color .18s;
  }
  .icon-btn:active { background: rgba(var(--accent-rgb), .16); color: var(--accent); }
  .icon-btn.rec { background: #3a1f2a; color: #ff8b8b; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55 } }
  #input {
    flex: 1; min-height: 42px; max-height: 120px; resize: none;
    background: var(--panel-2); color: var(--text); border: 1px solid transparent;
    border-radius: 21px; padding: 10px 16px; font-size: 15px; line-height: 1.45;
    outline: none; font-family: inherit;
    transition: border-color .2s, box-shadow .2s, background-color .38s;
  }
  #input::placeholder { color: var(--muted); opacity: .8; }
  #input:focus { border-color: rgba(var(--accent-rgb), .55); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .14); }
  #send {
    width: 42px; height: 42px; flex: 0 0 42px; border: 0; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white;
    font-size: 16px; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 4px 14px rgba(var(--accent-rgb), .35);
    transition: opacity .2s, transform .15s, box-shadow .2s;
  }
  #send:active { transform: scale(.92); }
  #send.off { opacity: .35; box-shadow: none; }
  /* 语音输入：按住说话 + 实时声纹 */
  #voicePad {
    flex: 1; min-height: 42px; display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid transparent; border-radius: 21px;
    user-select: none; -webkit-user-select: none; cursor: pointer;
    transition: background-color .2s, border-color .2s;
  }
  #voicePad.rec { border-color: var(--accent); background: rgba(var(--accent-rgb), .14); }
  #voicePad .vhint { color: var(--muted); font-size: 15px; }
  #voicePad.rec .vhint { color: var(--accent); font-weight: 600; }
  #vwaves { display: none; }
  #voicePad.rec #vwaves { display: block; }
  #voicePad.rec .vhint { display: none; }
  #preview { display: none; padding: 6px 12px 0; background: var(--panel); }
  #preview img { height: 56px; border-radius: 8px; }
  #preview .x { color: var(--muted); margin-left: 8px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>

<script>
const $ = (s) => document.querySelector(s);
const store = {
  get token() { return localStorage.getItem('xg_token'); },
  set token(v) { v ? localStorage.setItem('xg_token', v) : localStorage.removeItem('xg_token'); },
};

// ── 多 AI 状态 ──
// 必须放在所有 applySettings / 渲染之前：它们会在脚本早期被调用，
// 用到 curAi 时如果还没初始化，会撞 TDZ 把整个页面搞死。
let aiList = [];
let curAi = localStorage.getItem('tc_ai') || 'dsh';
const AI_ICONS = {
  dsh: '/ai-icons/dsh.png',
  claude: '/ai-icons/claude.png',
  gemini: '/ai-icons/gemini.png',
  codex: '/ai-icons/codex.png',
  kimi: '/ai-icons/kimi.png',
};
let pendingImage = null;      // 预览用的 objectURL
let pendingImageBlob = null;  // 实际上传的压缩后二进制
let busy = false;
let lastSendSig = '';
let pendingTexts = [];
let pendingSticker = false;
let pendingImages = [];
let sendBatchTimer = null;
let lastSendAt = 0;

const chatEl = $('#chat');
const inputEl = $('#input');
const sendBtn = $('#send');
const subEl = $('#sub');
const dotEl = $('#dot');

function setStatus(text, cls) {
  subEl.textContent = text;
  dotEl.className = 'dot' + (cls ? ' ' + cls : '');
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── 消息提示：声音 + 震动 + 标题闪烁 + 后台系统通知 ──
let _audioCtx = null;
function beep(times = 2) {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    let t = _audioCtx.currentTime;
    for (let i = 0; i < times; i++) {
      const o = _audioCtx.createOscillator();
      const g = _audioCtx.createGain();
      o.connect(g); g.connect(_audioCtx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(1320, t + 0.08);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.start(t); o.stop(t + 0.24);
      t += 0.26;
    }
  } catch { /* 静音失败不影响消息 */ }
}

function flashTitle() {
  if (!document.hidden) return;
  const base = document.title.replace(/^●\s*/, '');
  let on = false;
  const timer = setInterval(() => {
    if (!document.hidden) { clearInterval(timer); document.title = base; return; }
    on = !on;
    document.title = on ? '● ' + base : base;
  }, 800);
}

function notifyIncoming(text) {
  beep(2);
  try { navigator.vibrate?.([70, 45, 70]); } catch { /* 没权限就算了 */ }
  flashTitle();
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification((loadSettings().aiNick || 'AI'), { body: String(text).slice(0, 80), tag: 'tidecove', renotify: true }); } catch { /* ignore */ }
  }
}

async function askNotifyPermission() {
  try {
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }
  } catch { /* ignore */ }
}

// ── SSE 推送：服务器可主动发消息 ──
let _es = null;
function connectEvents() {
  if (_es) { try { _es.close(); } catch { /* ignore */ } }
  if (!store.token) return;
  try {
    _es = new EventSource(`/api/events?token=${encodeURIComponent(store.token)}`);
    _es.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'message') {
          renderSegments('ai', msg.text, { images: msg.images, audio: msg.audio, ts: msg.ts || Date.now() });
        } else if (msg.type === 'diary') {
          // 我自己写的日记：日记页开着就顺手刷一下
          const page = document.getElementById('pp-diary');
          if (page && !page.hidden && window.__loadDiary) window.__loadDiary();
        }
      } catch { /* 坏帧忽略 */ }
    };
    // EventSource 自带重连，不用手写
    _es.onerror = () => { /* 等它自己重连 */ };
  } catch { /* 不支持就算了 */ }
}

// 按句号拆段：去掉句末的句号，逗号变空格，像真人打字
// 主人 11-20 定的规矩：只把句号藏起来，逗号换空格；感叹号、问号、省略号这些语气符号要正常显示，
// 以前这里把 [。！？!?…] 整组删掉了，结果一句话读起来干巴巴的，连情绪都没了。
function splitSentences(text) {
  const src = String(text || '')
    .replace(/\r/g, '')
    .replace(/\n+/g, ' ')
    .replace(/[，,、；;：:]/g, ' ');
  // 一整段「非句末标点 + 连续的句末标点」才算一句：这样 …… 和 ？！ 不会被从中间劈开
  const chunks = src.match(/[。！？!?…]*[^。！？!?…]+[。！？!?…]*/g) || [];
  return chunks
    .map((s) => s.replace(/[。]+/g, '').replace(/\s+/g, ' ').trim())
    .filter(Boolean);
}

function scrollBottom(smooth = true) {
  try {
    if (smooth) {
      chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: 'smooth' });
    } else {

}

// 把一条「输入中」气泡原地变成有内容的消息
function fillBubble(el, text, extra = {}) {
  if (!el || !el.parentNode) return;
  const b = el.querySelector('.bubble');
  if (!b) { el.remove(); return; }
  let html = esc(text);
  if (extra.images?.length) {
    html += extra.images.map((u) => `<span class="imgwrap"><img src="${esc(u)}" alt=""></span>`).join('');
  }
  if (extra.audio) {
    const dur = Math.max(0, Math.round(Number(extra.duration || 0)));
    html += '<div class="voice" data-src="' + esc(extra.audio) + '" data-dur="' + dur + '" data-transcript="' + esc(extra.transcript || '') + '">'
      + '<span class="vplay"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>'
      + '<span class="vbar"><i></i></span>'
      + '<span class="vdur">' + (dur > 0 ? dur + '"' : '…') + '</span>'
      + '</div>';
  }
  b.innerHTML = html;
  b.classList.add('grow');
  el.removeAttribute('id');
  scrollBottom();
}

// ── 后台不打断的计时：基于绝对时间，切回前台立刻补齐 ──
// 手机 WebView 一切后台就会冻结 setTimeout，所以不能用相对延时等。
function waitUntil(ts) {
  return new Promise((resolve) => {
    let timer = null;
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      if (timer) { clearTimeout(timer); timer = null; }
      document.removeEventListener('visibilitychange', onVis);
      resolve();
    };
    const check = () => { if (Date.now() >= ts) finish(); };
    const onVis = () => { if (document.visibilityState === 'visible') check(); };
    const loop = () => {
      check();
      if (done) return;
      const left = ts - Date.now();
      if (left <= 0) return finish();
      timer = setTimeout(loop, Math.min(250, Math.max(50, left)));
    };
    document.addEventListener('visibilitychange', onVis);
    loop();
  });
}

// 分段渲染：每一句都先挂一个「输入中」气泡，等够打字时间（0.3 秒/字）再原地变成内容
// 全部按绝对时间排程：切后台再回来，已经该出现的会立刻补出来，不用重新等
// firstEl：第一条复用 send 里那个已在显示的输入中气泡
function renderSegments(role, text, extra = {}, firstEl = null) {
  const parts = splitSentences(text);
  if (!parts.length) {
    if (firstEl) firstEl.remove();
    return;
  }

  const startAt = Date.now();
  let acc = 0;
  const tasks = parts.map((seg, i) => {
    const isLast = i === parts.length - 1;
    const typingCost = seg.length * 300; // 0.3 秒一个字
    const task = {
      seg,
      isLast,
      first: i === 0,
      showAt: startAt + acc,              // 气泡出现的时刻
      fillAt: startAt + acc + typingCost, // 内容填进去的时刻
      el: null,
      filled: false,
    };
    acc += typingCost;
    return task;
  });

  let tickTimer = null;
  let running = true;

  function cleanup() {
    running = false;
    if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
    document.removeEventListener('visibilitychange', onVis);
  }

  function tick() {
    if (!running) return;
    const now = Date.now();
    let pending = false;
    for (const t of tasks) {
      if (!t.el && now >= t.showAt) {
        t.el = (t.first && firstEl) ? firstEl : typingBubble();
      }
      if (t.el && !t.filled && now >= t.fillAt) {
        fillBubble(t.el, t.seg, t.isLast ? extra : {});
        t.filled = true;
      }
      if (!t.filled) pending = true;
    }
    if (!pending) { cleanup(); return; }
    tickTimer = setTimeout(tick, 120);
  }

  // 切回前台时立刻推进一次——后台被冻结时全靠这一下把落后的补出来
  const onVis = () => {
    if (document.visibilityState === 'visible') {
      const wasRunning = running;
      running = true;
      tick();
      if (!wasRunning && tickTimer) { /* tick 里已重排 */ }
    }
  };

  document.addEventListener('visibilitychange', onVis);
  tick();
}

function loadSettings() {

// 设置同时存服务端：隧道换域名后 localStorage 会清空，靠这份副本找回
// 原则：客户端是正本，服务端只存副本 —— 拉回来时本地优先，不让副本盖掉正本
let settingsPushTimer = null;
let settingsPending = null;

function postSettings(s, useBeacon) {
  if (!store.token) return;
  const body = JSON.stringify({ token: store.token, settings: s });
  if (useBeacon && navigator.sendBeacon) {
    try {
      navigator.sendBeacon('/api/settings', new Blob([body], { type: 'application/json' }));
      return;
    } catch { /* 退回 fetch */ }
  }
  // 注意：只有页面要关闭时才用 keepalive —— 它带 64 KiB 的 body 上限，
  // 头像这种几十上百 KB 的数据用它必然失败，之前就是这样悄悄存不上去的。
  fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body,
    keepalive: useBeacon === true,
  }).then((r) => {
    if (!r.ok) console.warn('设置同步失败 HTTP', r.status);
  }).catch((e) => console.warn('设置同步失败', e && e.message));
}

function pushSettings(s) {
  if (!store.token) return;
  settingsPending = s;
  clearTimeout(settingsPushTimer);
  settingsPushTimer = setTimeout(() => {
    settingsPushTimer = null;
    const last = settingsPending;
    settingsPending = null;
    if (last) postSettings(last, false);
  }, 600);
}

/** 切后台 / 关页面前，把没发出去的那一次立刻补发 */
function flushSettings() {
  if (!settingsPending) return;
  clearTimeout(settingsPushTimer);
  settingsPushTimer = null;
  const last = settingsPending;
  settingsPending = null;
  postSettings(last, true);
}
window.addEventListener('pagehide', flushSettings);
document.addEventListener('visibilitychange', () => {

});

      const merged = { ...remote, ...loadSettings() };

function hexToRgb(h) {
  const v = String(h || '').replace('#', '');
  const full = v.length === 3 ? v.split('').map((c) => c + c).join('') : v;
  const n = parseInt(full || '7c5cff', 16);
  if (!Number.isFinite(n)) return '124, 92, 255';
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(', ');
}

  };

/** 把聊天区已渲染消息的头像换成当前设置（只改 src，不重建 DOM，切换 AI 时才不卡） */
function refreshAvatars() {
  const box = document.getElementById('chat');
  if (!box) return;
  const s = loadSettings();
  const aiSrc = aiAvatarSrc();
  const meSrc = s.meAvatar || '';
  const meChar = (s.meNick || '主').slice(0, 1);
  box.querySelectorAll('.msg').forEach((div) => {
    const old = div.querySelector('.avatar');
    if (!old) return;
    if (div.classList.contains('me')) {
      if (meSrc) {
        const img = old.querySelector('img');
        if (img) { if (img.getAttribute('src') !== meSrc) img.src = meSrc; }
        else old.innerHTML = '<img src="' + meSrc + '" alt="">';
      } else if (old.textContent !== meChar) {
        old.textContent = meChar;
      }
      return;
    }
    // 群聊里每条消息挂着自己的 AI：用各自的头像，别被"当前 AI"覆盖
    const bubbleAi = old.getAttribute('data-ai');
    if (bubbleAi) {
      const p = (s.aiProfiles && typeof s.aiProfiles === 'object' ? s.aiProfiles[bubbleAi] : null) || {};
      const src = p.avatar || AI_ICONS[bubbleAi] || '/icon-192.png';
      const img2 = old.querySelector('img');
      if (img2) { if (img2.getAttribute('src') !== src) img2.src = src; }
      else old.innerHTML = '<img src="' + src + '" alt="">';
      return;
    }
    const img = old.querySelector('img');
    if (img) { if (img.getAttribute('src') !== aiSrc) img.src = aiSrc; }
    else old.innerHTML = '<img src="' + aiSrc + '" alt="">';
  });
}

function parseMentionAi(text) {
  const MAP = [['DeepSeek', 'dsh'], ['Claude', 'claude'], ['ChatGPT', 'codex'], ['Kimi', 'kimi'], ['Gemini', 'gemini']];
  for (const [n, id] of MAP) {

  migrateAiProfiles();
  if (window.__pullStickers) window.__pullStickers();

  if (window.__loadDiary) window.__loadDiary(true);
  if (!st.dshReady || !st.streamReady) setTimeout(pollStatus, 3000);
}

let historyHasMore = true;
let historyOldestTs = 0;
let loadingMore = false;

function buildMsgEls(it) {
  const frag = document.createDocumentFragment();
  const showText = ((it.text === '[图片]' && it.images?.length) || it.audio) ? '' : it.text;
  const role = it.role === 'user' ? 'user' : 'ai';
  // 群聊历史：按当时的分段还原，每个 AI 自己一条（各自头像/昵称）
  if (it.segments && it.segments.length) {
    for (const seg of it.segments) {
      frag.appendChild(renderMessage(role, seg.text, { ts: it.ts }, false, seg.ai));
    }
    return frag;
  }
  const segs = splitSentences(showText);
  if (!segs.length) {
    frag.appendChild(renderMessage(role, showText, it, false));
  } else {
    segs.forEach((seg, i) => {
      const isLast = i === segs.length - 1;
      frag.appendChild(renderMessage(role, seg, isLast ? it : {}, false));
    });
  }
  return frag;
}

// 图片是异步加载的：先落底，等所有图片加载完再落一次，否则会停在最后一条文字上
function scrollToBottomAfterImages() {
  scrollBottom(false);
  const imgs = Array.from(chatEl.querySelectorAll('img'));
  let pending = imgs.filter((i) => !i.complete).length;
  if (pending === 0) { scrollBottom(false); return; }
  const done = () => {
    pending -= 1;
    if (pending <= 0) scrollBottom(false);
  };
  imgs.forEach((img) => {
    if (img.complete) return;
    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', done, { once: true });
  });
  // 兜底：2 秒后无论如何再落一次
  setTimeout(() => scrollBottom(false), 2000);
}

let lastRenderedTs = 0;
let bulkRendering = false;

/** 把一批消息画进聊天区（清空后重画）。
 *  关键：整批只做一次 DOM 挂载、只滚一次底，不在循环里反复触碰 DOM。 */
function renderHistoryItems(items) {
  bulkRendering = true;
  try {
    chatEl.innerHTML = '';
    if (!items.length) { lastRenderedTs = 0; return; }
    historyOldestTs = items.length ? items[0].ts : 0;
    lastRenderedTs = items[items.length - 1].ts || 0;
    const frag = document.createDocumentFragment();
    for (const it of items) frag.appendChild(buildMsgEls(it));
    chatEl.appendChild(frag);
  } finally {
    bulkRendering = false;
  }
  scrollToBottomAfterImages(); // 等图片加载完再落底
}

// 每个 AI 的历史缓存：切回来先秒显，再去后台拉最新
const historyCache = new Map();

async function loadHistory() {
  const aiAtStart = curAi;
  const cached = historyCache.get(aiAtStart);
  if (cached && cached.length) {
    historyHasMore = true;
    renderHistoryItems(cached); // 有缓存就先画，切换瞬间就有内容
  }
  try {
    const { items, hasMore } = await api('/api/history?token=' + encodeURIComponent(store.token) + '&limit=30&ai=' + encodeURIComponent(aiAtStart));
    if (aiAtStart !== curAi) return; // 期间又切走了，别用旧数据覆盖
    historyHasMore = Boolean(hasMore);
    historyCache.set(aiAtStart, items);
    const lastCached = cached && cached.length ? cached[cached.length - 1].ts : 0;
    const lastNew = items.length ? items[items.length - 1].ts : 0;
    if (!cached || !cached.length || lastCached !== lastNew || items.length !== cached.length) {
      renderHistoryItems(items);
    }
  } catch (e) {
    // 加载失败别让屏幕停在别人的历史上
    try { tcToast('历史加载失败：' + (e && e.message ? e.message : e), 3200); } catch { /* ignore */ }
    if (aiAtStart === curAi) {
      const box = document.getElementById('chat');
      if (box && !box.children.length) box.innerHTML = '';
    }
  }
}

/** 首屏画完之后，把其他 AI 的最近 30 条也悄悄拉进缓存——切过去就几乎不用等 */
async function preloadOtherHistories() {
  const others = (aiList || []).filter((p) => p.id !== curAi && p.available);
  for (const p of others) {
    if (historyCache.has(p.id)) continue;
    try {
      const { items } = await api('/api/history?token=' + encodeURIComponent(store.token) + '&limit=30&ai=' + encodeURIComponent(p.id));
      historyCache.set(p.id, items || []);
    } catch { /* 某个 AI 拉不到就算了 */ }
  }
}

// 划到顶部就往前加载 60 条，并保持当前位置
async function loadMoreHistory() {
  if (!historyHasMore || loadingMore || !historyOldestTs) return;
  const aiAtStart = curAi;
  loadingMore = true;
  try {
    const { items, hasMore } = await api('/api/history?token=' + encodeURIComponent(store.token) + '&limit=60&before=' + historyOldestTs + '&ai=' + encodeURIComponent(aiAtStart));
    // 期间切到别的 AI 了：这批是上一个 AI 的旧数据，直接丢掉，绝不能插进当前视图
    if (aiAtStart !== curAi) return;
    historyHasMore = Boolean(hasMore);
    if (items.length) {
      historyOldestTs = items[0].ts;
      const prevH = chatEl.scrollHeight;
      const frag = document.createDocumentFragment();
      for (const it of items) frag.appendChild(buildMsgEls(it));
      chatEl.insertBefore(frag, chatEl.firstChild);
      // 撑高了多少就补回去，视觉上不跳
      chatEl.scrollTop += chatEl.scrollHeight - prevH;
    }
  } catch { /* ignore */ }
  loadingMore = false;
}

// 划到顶就加载更早的（chat 容器 + window 都监听，阈值放宽）
function maybeLoadMore() {
  const top = chatEl.scrollTop;
  const nearTop = top <= 120 || (window.scrollY || 0) <= 120;
  if (nearTop) loadMoreHistory();
}
chatEl.addEventListener('scroll', maybeLoadMore, { passive: true });
window.addEventListener('scroll', maybeLoadMore, { passive: true });

// 兜底：每 1.5 秒检查一次（有些 WebView 滚动事件不稳）
setInterval(() => {
  if (chatEl && !chatEl.classList.contains('hidden')) maybeLoadMore();
}, 1500);

function autosize() {

  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

/** 发送键的「灰着」状态用 class 表示，不用 disabled ——
 *  disabled 会让 Android WebView 把焦点从输入框拿走，键盘跟着收起来 */
function setSendEnabled(on) {
  sendBtn.classList.toggle('off', !on);
}

sendBtn.onclick = () => {
  if (sendBtn.classList.contains('off')) return;
  send();

async function send() {
  // 借这次点击解锁音频上下文（WebView 的 autoplay 策略）
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    _audioCtx.resume();
  } catch { /* ignore */ }
  if (busy) return;
  const text = inputEl.value.trim();
  const blob = pendingImageBlob;
  const localUrl = pendingImage;
  if (!text && !blob) return;

  // 防重复：800ms 内同样的文字+图片不算第二次（手机点两下 / 卡顿重触发）
  const sig = text + '|' + (blob ? blob.size : 0) + '|' + (localUrl || '');
  if (sig === lastSendSig && Date.now() - lastSendAt < 800) return;
  lastSendSig = sig;
  lastSendAt = Date.now();

  busy = true;
  setSendEnabled(false);

  // ① 先把消息和图片放上屏（本地图 + 转圈），不等上传
  const isSticker = pendingSticker;
  pendingSticker = false;
  const msgEl = renderMessage('user', text, {
    images: localUrl ? [localUrl] : [],
    uploading: Boolean(blob),
    sticker: isSticker,
    ts: Date.now(),
  });
  inputEl.value = ''; autosize();
  pendingImage = null; pendingImageBlob = null;
  $('#preview').style.display = 'none';

  // ② 后台上传，传完把转圈去掉（这段时间屏幕上是安静的——真人也不会秒回）
  const images = [];
  if (blob) {
    try {
      const up = await uploadBlob(blob);
      images.push(up.url);
      msgEl.querySelectorAll('.uploading').forEach((el) => el.remove());
    } catch (e) {
      msgEl.querySelectorAll('.uploading').forEach((el) => el.remove());
      msgEl.querySelectorAll('.imgwrap').forEach((el) => el.classList.add('failed'));
      renderMessage('ai', '图片上传失败：' + e.message);
      busy = false;
      setSendEnabled(!(!inputEl.value.trim()));
      return;
    }
  }

  // ③ 先不发给 AI：等 10 秒，看主人还会不会接着发
  //    这 10 秒内再有消息就合并成一条，安静满 10 秒才真正发出去
  const batchText = text || (images.length ? '[图片]' : '');
  // 同一句话在合并窗口里只留一条：点了没反应又点一次的话，不该变成两条一样的
  if (batchText && !images.length && pendingTexts.includes(batchText)) {
    // 已经排队过这句，忽略这次重复点击
  } else {
    pendingTexts.push(batchText);
    pendingImages.push(...images);
  }
  clearTimeout(sendBatchTimer);
  sendBatchTimer = setTimeout(flushSendBatch, 10000);

  busy = false;
  // 点一次后按钮歇 1.2 秒，防止「以为没发出去」又点一遍（状态栏不动）
  setSendEnabled(false);
  setTimeout(() => {
    setSendEnabled(!(!inputEl.value.trim() && !pendingImage));
  }, 1200);
}

// 安静 10 秒后：把攒下的几条合并成一次请求
async function flushSendBatch() {
  if (!pendingTexts.length) return;
  const text = pendingTexts.join('\n');
  const images = pendingImages.slice();
  pendingTexts = [];
  pendingImages = [];
  sendBatchTimer = null;

  const t = typingBubble(parseMentionAi(text));
  try {
    const r = await api('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: store.token, text, images, ai: curAi }),
    });
    if (r && r.silent) { t.remove(); return; }
    // 拿到回复后再愣 3-10 秒（真人不会秒回）
    // 用绝对时间等：切后台冻结定时器也不影响，回来立刻补上
    const thinkMs = 3000 + Math.random() * 7000;
    await waitUntil(Date.now() + thinkMs);
    // 群聊（聚合）：每个 AI 各自一条气泡，用各自的头像
    if (r.segments && r.segments.length) {
      t.remove();
      for (let i = 0; i < r.segments.length; i++) {
        const seg = r.segments[i];
        // 第一个立刻出，后面的隔一会儿（像真的在挨个回）
        if (i > 0) await waitUntil(Date.now() + 700 + Math.random() * 600);
        renderMessage('ai', seg.text, { ts: Date.now() }, true, seg.ai);
      }
      return;
    }
    // 注意：不能 t.remove()，renderSegments 要靠它原地变身
    renderSegments('ai', r.reply, { images: r.images, audio: r.audio, ts: Date.now() }, t);
  } catch (e) {
    t.remove();
    renderMessage('ai', '⚠️ ' + e.message);
  }
}

// ── 图片：压缩后二进制直传（不再 base64）──
$('#imgBtn').onclick = () => { pickMode = 'image'; $('#file').click(); };

/** 把图缩到最长边 maxSide，输出 JPEG，体积通常只剩 10~25% */
function compressImage(file, maxSide = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(url);
          resolve(blob || file);
        }, 'image/jpeg', quality);
      } catch {
        URL.revokeObjectURL(url);
        resolve(file);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/** 二进制上传：Content-Type 用图片类型，token 走 header */
async function uploadBlob(blob) {
  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'Content-Type': blob.type || 'image/jpeg', 'X-Token': store.token },
    body: blob,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

$('#file').onchange = async (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  e.target.value = '';
  try {
    const blob = await compressImage(f, 1600, 0.82);
    pendingImageBlob = blob;
    if (pendingImage) URL.revokeObjectURL(pendingImage);
    pendingImage = URL.createObjectURL(blob);
    $('#previewImg').src = pendingImage;
    $('#preview').style.display = 'block';
    setSendEnabled(true);
  } catch {
    renderMessage('ai', '图片处理失败，换一张试试');
  }
};

$('#previewX').onclick = () => {
  if (pendingImage) URL.revokeObjectURL(pendingImage);
  pendingImage = null;
  pendingImageBlob = null;
  $('#preview').style.display = 'none';

};

// ── 语音输入：点麦克风切到语音框，长按录音（带实时声纹），松手发送 ──
let voiceMode = false;
let micRecording = false;
let usingNative = false;
let recStartAt = 0;
let mediaRec = null;
let recChunks = [];
let recStream = null;
let audioCtx = null;
let analyser = null;
let waveRaf = 0;

const micBtn = $('#micBtn');
const voicePad = $('#voicePad');
const MIC_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>';
const KB_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>';

function pickAudioMime() {
  const list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  for (const m of list) {
    try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; } catch { /* ignore */ }
  }
  return '';
}

/** 逐级放宽约束地要麦克风：不少 Android WebView 会在默认的音频预处理上失败（NotReadableError） */
async function openMic() {
  const tries = [
    { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } },
    { audio: { echoCancellation: false } },
    { audio: { channelCount: 1 } },
    { audio: true },
  ];
  let lastErr = null;
  for (const c of tries) {
    try {
      return await navigator.mediaDevices.getUserMedia(c);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('拿不到麦克风');
}

function setVoiceMode(on) {
  voiceMode = !!on;
  const inp = $('#input');
  if (inp) inp.classList.toggle('hidden', voiceMode);
  if (voicePad) voicePad.classList.toggle('hidden', !voiceMode);
  if (micBtn) {
    micBtn.innerHTML = voiceMode ? KB_SVG : MIC_SVG;
    micBtn.title = voiceMode ? '切换到键盘' : '语音';
  }
  if (!voiceMode) {
    stopVoiceRec(true);
    // 这里不 focus：切回键盘输入只是换输入框，键盘等用户点输入框再弹
  }
}
if (micBtn) micBtn.onclick = () => setVoiceMode(!voiceMode);

function drawWaves() {
  const cv = document.getElementById('vwaves');
  if (!cv || !analyser) return;
  const c = cv.getContext('2d');
  const n = analyser.frequencyBinCount;
  const data = new Uint8Array(n);
  analyser.getByteFrequencyData(data);
  c.clearRect(0, 0, cv.width, cv.height);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7c5cff';
  c.fillStyle = accent;
  const bars = 24;
  const bw = cv.width / bars;
  for (let k = 0; k < bars; k++) {
    const v = data[Math.floor(k * n / bars)] / 255;
    const h = Math.max(2, v * cv.height);
    c.fillRect(k * bw + 1, (cv.height - h) / 2, Math.max(2, bw - 2), h);
  }
  waveRaf = requestAnimationFrame(drawWaves);
}

function startAudioGraph(stream) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    src.connect(analyser);
    cancelAnimationFrame(waveRaf);
    drawWaves();
  } catch { /* 声纹画不出来也不影响录音 */ }
}

function finishAudioGraph() {
  cancelAnimationFrame(waveRaf);
  waveRaf = 0;
  try { if (recStream) recStream.getTracks().forEach((t) => t.stop()); } catch { /* ignore */ }
  recStream = null;
  analyser = null;
  if (voicePad) voicePad.classList.remove('rec');
}

/** 原生录音拿不到音频流时，用一段模拟波形至少让人知道在录 */
function startFakeWave() {
  const cv = document.getElementById('vwaves');
  if (!cv) return;
  const c = cv.getContext('2d');
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7c5cff';
  const bars = 24;
  const bw = cv.width / bars;
  const t0 = Date.now();
  const frame = () => {
    c.clearRect(0, 0, cv.width, cv.height);
    c.fillStyle = accent;
    const t = (Date.now() - t0) / 260;
    for (let i = 0; i < bars; i++) {
      const v = (Math.sin(t + i * 0.55) * 0.5 + 0.5) * (0.35 + 0.65 * Math.random());
      const h = Math.max(2, v * cv.height);
      c.fillRect(i * bw + 1, (cv.height - h) / 2, Math.max(2, bw - 2), h);
    }
    waveRaf = requestAnimationFrame(frame);
  };
  cancelAnimationFrame(waveRaf);
  frame();
}

function hasNativeRec() {
  try {
    return !!(window.TideCoveNative && window.TideCoveNative.available && window.TideCoveNative.available());
  } catch { return false; }
}

async function startVoiceRec() {
  if (micRecording) return;

  // ① 优先走 App 原生录音（WebView 的 getUserMedia 在部分机型上拿不到音频源）
  if (hasNativeRec()) {
    let r = '';
    try { r = String(window.TideCoveNative.start() || ''); } catch (e) { r = 'ERR:' + e.message; }
    if (r === 'OK') {
      micRecording = true;
      usingNative = true;
      recStartAt = Date.now();
      if (voicePad) voicePad.classList.add('rec');
      startFakeWave();
      return;
    }
    if (r === 'NEED_PERM') {
      renderMessage('ai', '需要麦克风权限：在弹窗里点「允许」后，再按一次说话。');
      return;
    }
    renderMessage('ai', '原生录音没起来（' + r + '），改试网页录音…');
  }

  // ② 回退：WebView 录音
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    renderMessage('ai', '这台手机的 WebView 不支持录音');
    return;
  }
  try {
    if (recStream) { try { recStream.getTracks().forEach((t) => t.stop()); } catch { /* ignore */ } recStream = null; }
    const stream = await openMic();
    recStream = stream;
    usingNative = false;
    recChunks = [];
    const mime = pickAudioMime();
    mediaRec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    mediaRec.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = async () => {
      const type = (mediaRec && mediaRec.mimeType) || 'audio/webm';
      finishAudioGraph();
      micRecording = false;
      const blob = new Blob(recChunks, { type });
      recChunks = [];
      if (blob.size < 1200) { renderMessage('ai', '太短了，没录到声音'); return; }
      await sendVoice(blob, recStartAt ? (Date.now() - recStartAt) / 1000 : 0);
    };
    mediaRec.start();
    micRecording = true;
    recStartAt = Date.now();
    if (voicePad) voicePad.classList.add('rec');
    startAudioGraph(stream);
  } catch (e) {
    const name = (e && e.name) || '';
    const detail = [name, e && e.message].filter(Boolean).join(' / ');
    let tip = '';
    if (name === 'NotAllowedError') {
      tip = '去手机「设置 → 应用 → TideCove → 权限」把麦克风打开。';
    } else if (name === 'NotReadableError') {
      tip = '麦克风被别的 App 占着，或者被系统的隐私保护冻住了。\n先关掉微信、录音机、语音助手之类的应用再试；还不行就重启一次手机。';
    } else if (name === 'NotFoundError') {
      tip = '系统里没找到可用的麦克风设备。';
    } else if (name === 'SecurityError') {
      tip = '当前不是 HTTPS 页面，浏览器不允许录音。请用公网 https 地址打开。';
    }
    renderMessage('ai', '拿不到麦克风：' + (detail || '未知原因') + (tip ? '\n' + tip : ''));
  }
}

function stopVoiceRec(abort) {
  if (!micRecording) return;

  // 原生录音收尾
  if (usingNative) {
    let path = '';
    try { path = String(window.TideCoveNative.stop() || ''); } catch (e) { path = 'ERR:' + e.message; }
    micRecording = false;
    usingNative = false;
    cancelAnimationFrame(waveRaf);
    waveRaf = 0;
    if (voicePad) voicePad.classList.remove('rec');
    if (abort) return;
    if (path.indexOf('ERR:') === 0) { renderMessage('ai', '录音失败：' + path); return; }
    let b64 = '';
    try { b64 = String(window.TideCoveNative.readBase64(path) || ''); } catch (e) { b64 = 'ERR:' + e.message; }
    if (b64.indexOf('ERR:') === 0) { renderMessage('ai', '读不到录音：' + b64); return; }
    try {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const blob = new Blob([arr], { type: 'audio/mp4' });
      if (blob.size < 1200) { renderMessage('ai', '太短了，没录到声音'); return; }
      sendVoice(blob, recStartAt ? (Date.now() - recStartAt) / 1000 : 0);
    } catch (e) {
      renderMessage('ai', '处理录音失败：' + (e.message || ''));
    }
    return;
  }

  // WebView 录音收尾
  try {
    if (mediaRec && mediaRec.state !== 'inactive') {
      if (abort) mediaRec.onstop = null;
      mediaRec.stop();
    }
  } catch { /* ignore */ }
  if (abort) {
    finishAudioGraph();
    micRecording = false;
    recChunks = [];
  }
}

let vPressTimer = null;

function hideVoiceText(el) {
  const bubble = el.closest('.bubble');

}

function showVoiceText(el, text) {
  const bubble = el.closest('.bubble');
  if (!bubble) return;

  bubble.insertAdjacentHTML('afterbegin', '<div class="vtext">' + esc(text) + '</div>');

async function transcribeVoice(el, src) {
  const bubble = el.closest('.bubble');
  // 已经显示着 → 这一次是「收起」
  if (bubble && bubble.querySelector('.vtext')) { hideVoiceText(el); return; }

  // 发的时候已经转过了，直接用缓存，不用再等
  const cached = el.getAttribute('data-transcript') || '';
  if (cached) { showVoiceText(el, cached); return; }

  const durEl = el.querySelector('.vdur');
  const old = durEl ? durEl.textContent : '';
  if (durEl) durEl.textContent = '识别中';
  try {
    const r = await api('/api/asr', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: store.token, url: src }),
    });
    const text = (r.text || '').trim();
    if (durEl) durEl.textContent = old;
    if (!text) { alert('没识别出内容'); return; }
    el.setAttribute('data-transcript', text);
    showVoiceText(el, text);
  } catch (e) {
    if (durEl) durEl.textContent = old;
    alert('转文字失败：' + (e.message || '转写服务没开'));
  }
}

function showVoiceMenu(el) {
  closeVoiceMenu();
  const src = el.getAttribute('data-src');
  if (!src) return;
  suppressVoiceClick = true;
  const menu = document.createElement('div');
  menu.className = 'vmenu';
  const shown = !!(el.closest('.bubble') && el.closest('.bubble').querySelector('.vtext'));
  menu.innerHTML = '<button>' + (shown ? '收起文字' : '转文字') + '</button>';
  document.body.appendChild(menu);
  vMenuEl = menu;
  const r = el.getBoundingClientRect();
  const mw = menu.offsetWidth || 88;
  const mh = menu.offsetHeight || 36;
  let left = r.left;
  if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
  let top = r.top - mh - 6;
  if (top < 8) top = r.bottom + 6;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  menu.querySelector('button').onclick = (ev) => {
    ev.stopPropagation();
    closeVoiceMenu();
    transcribeVoice(el, src);
  };
  setTimeout(() => {
    document.addEventListener('pointerdown', function h(e) {
      if (vMenuEl && !vMenuEl.contains(e.target)) closeVoiceMenu();
      document.removeEventListener('pointerdown', h);
    });
  }, 30);
}

async function sendVoice(blob, durationSec) {
  const dur = Math.max(0, Math.round(durationSec || 0));
  const localUrl = URL.createObjectURL(blob);
  let url = '';
  try {
    const up = await uploadBlob(blob);
    url = up.url;
  } catch (e) {
    renderMessage('ai', '语音上传失败：' + (e.message || ''));
    return;
  }

  // 后台转文字：AI 要靠它听懂，但气泡里默认不显示（要看得长按语音条）
  let transcript = '';
  try {
    const r = await api('/api/asr', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: store.token, url }),
    });
    transcript = (r.text || '').trim();
  } catch { /* 转不了就只发语音 */ }

  renderMessage('user', '', { audio: localUrl, duration: dur, transcript: transcript, ts: Date.now() });

  const t = typingBubble(parseMentionAi(text));
  try {
    const r2 = await api('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: store.token, text: transcript || '[语音]', audio: url, transcript, ai: curAi }),
    });
    const thinkMs = 3000 + Math.random() * 7000;
    await waitUntil(Date.now() + thinkMs);
    renderSegments('ai', r2.reply, { images: r2.images, audio: r2.audio, ts: Date.now() }, t);
  } catch (e) {
    t.remove();
    renderMessage('ai', '⚠️ ' + e.message);
  }
}

let avState = { data: '', s: 1, x: 50, y: 50 };
let avKey = 'me';
let avPaintCb = null;
let avFileEl = null;
let avDrag = null, avPinch = null;

function paintAv() {
  const img = document.getElementById('avImg');

(function initAvatarCrop() {
  const stage = document.getElementById('avStage');
  const cancel = document.getElementById('avCancel');
  const confirm = document.getElementById('avConfirm');
  const file = document.getElementById('meAvatarFile');
  if (!stage || !cancel || !confirm) return;

  function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      avDrag = { x: e.touches[0].clientX, y: e.touches[0].clientY, ox: avState.x, oy: avState.y };
      avPinch = null;
    } else if (e.touches.length === 2) {
      avDrag = null;
      avPinch = { d: dist(e.touches[0], e.touches[1]), s: avState.s };
    }
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && avDrag) {
      avState.x = clampNum(avDrag.ox + ((e.touches[0].clientX - avDrag.x) / 240) * 100, -100, 200);
      avState.y = clampNum(avDrag.oy + ((e.touches[0].clientY - avDrag.y) / 240) * 100, -100, 200);
      paintAv(); e.preventDefault();
    } else if (e.touches.length === 2 && avPinch) {
      avState.s = clampNum(avPinch.s * (dist(e.touches[0], e.touches[1]) / avPinch.d), 0.3, 6);
      paintAv(); e.preventDefault();
    }
  }, { passive: false });

  stage.addEventListener('touchend', () => { avDrag = null; avPinch = null; });

  // 鼠标
  stage.addEventListener('mousedown', (e) => {
    avDrag = { x: e.clientX, y: e.clientY, ox: avState.x, oy: avState.y };
  });
  window.addEventListener('mousemove', (e) => {
    if (!avDrag) return;
    const ap = document.getElementById('avatarPreview');
    if (!ap || !ap.classList.contains('show')) return;
    avState.x = clampNum(avDrag.ox + ((e.clientX - avDrag.x) / 240) * 100, -100, 200);
    avState.y = clampNum(avDrag.oy + ((e.clientY - avDrag.y) / 240) * 100, -100, 200);
    paintAv();
  });
  window.addEventListener('mouseup', () => { avDrag = null; });

  cancel.onclick = () => {
    closeAvatarCrop();
    if (avFileEl) avFileEl.value = '';
  };

  confirm.onclick = () => {
    const size = 256;
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    const im = new Image();
    im.onload = () => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.clip();
      const k = size / 240;
      const w = im.width * avState.s * k;
      const h = im.height * avState.s * k;
      const cx = (avState.x / 100) * size;
      const cy = (avState.y / 100) * size;
      ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h);
      ctx.restore();
      // JPEG 而不是 PNG：头像要同步到服务端，PNG 动辄几百 KB，
      // 现在压到二三十 KB，传输和存储都稳
      saveSettings({ [avKey + 'Avatar']: cv.toDataURL('image/jpeg', 0.86) });
      closeAvatarCrop();
      applyHeader();
      refreshAvatars();   // 聊天区已渲染的消息头像也立刻换掉
      if (avPaintCb) { try { avPaintCb(); } catch { /* ignore */ } }
      if (avFileEl) avFileEl.value = '';
    };
    im.src = avState.data;
  };
})();

  btn.onclick = () => {
    pickMode = 'bg';   // 告诉原生回调：这次选图是换背景，别当成发图片
    file.click();
  };

  /** 背景图压一下：原图动辄好几 MB，整个塞进设置会把同步请求撑爆 */
  function shrinkBg(src, maxSide, quality) {
    return shrinkImage(src, maxSide, quality);
  }

  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      let src = r.result;
      try { src = await shrinkBg(r.result, 1400, 0.82); } catch { /* 压不动就用原图 */ }
      open(src);
    };
    r.readAsDataURL(f);
  };

  cancel.onclick = () => {
    prev.classList.remove('show');
    file.value = '';
    applyBg(); // 恢复原来保存的背景
    if (settingsEl) settingsEl.classList.add('show'); // 回到主页
  };
  confirm.onclick = () => {
    saveSettings({ bgImage: st.data, bgScale: st.s, bgX: st.x, bgY: st.y });
    prev.classList.remove('show');
    file.value = '';
    applyBg();
    if (settingsEl) settingsEl.classList.add('show'); // 回到主页
  };
  if (clear) {
    clear.onclick = () => {
      saveSettings({ bgImage: '', bgScale: 1, bgX: 50, bgY: 50 });
      applyBg();
    };
  }

  function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, ox: st.x, oy: st.y };
      pinch = null;
    } else if (e.touches.length === 2) {
      drag = null;
      pinch = { d: dist(e.touches[0], e.touches[1]), s: st.s };
    }
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    const w = stage.clientWidth || 1;
    const h = stage.clientHeight || 1;
    if (e.touches.length === 1 && drag) {
      st.x = clampNum(drag.ox + ((e.touches[0].clientX - drag.x) / w) * 100, -50, 150);
      st.y = clampNum(drag.oy + ((e.touches[0].clientY - drag.y) / h) * 100, -50, 150);
      paint();
      e.preventDefault();
    } else if (e.touches.length === 2 && pinch) {
      const d = dist(e.touches[0], e.touches[1]);
      st.s = clampNum(pinch.s * (d / pinch.d), 1, 4);
      paint();
      e.preventDefault();
    }
  }, { passive: false });

  stage.addEventListener('touchend', () => { drag = null; pinch = null; });

  // 鼠标拖动（电脑调试用）
  stage.addEventListener('mousedown', (e) => {
    drag = { x: e.clientX, y: e.clientY, ox: st.x, oy: st.y };
  });
  window.addEventListener('mousemove', (e) => {
    if (!drag || !prev.classList.contains('show')) return;
    const w = stage.clientWidth || 1;
    const h = stage.clientHeight || 1;
    st.x = clampNum(drag.ox + ((e.clientX - drag.x) / w) * 100, -50, 150);
    st.y = clampNum(drag.oy + ((e.clientY - drag.y) / h) * 100, -50, 150);
    paint();
  });
  window.addEventListener('mouseup', () => { drag = null; });

  applyBg();
})();

}

/** 当前 AI 的独立设置：头像 / 昵称 / 气泡色 / 字号 / 背景 */
function aiProfile() {
  const s = loadSettings();
  const all = (s.aiProfiles && typeof s.aiProfiles === 'object') ? s.aiProfiles : {};
  return all[curAi] || {};
}

function saveAiProfile(patch) {
  const s = loadSettings();
  const all = (s.aiProfiles && typeof s.aiProfiles === 'object') ? { ...s.aiProfiles } : {};
  all[curAi] = { ...(all[curAi] || {}), ...patch };
  return saveSettings({ aiProfiles: all });
}

/** 这个 AI 现在该用的头像：自己设过就用，否则用它的图标 */
function aiAvatarSrc() {
  const p = aiProfile();
  return p.avatar || AI_ICONS[curAi] || '/icon-192.png';
}

/** 这个 AI 现在该用的昵称 */
function aiDisplayName(id) {
  const target = id || curAi;
  const s = loadSettings();
  const all = (s.aiProfiles && typeof s.aiProfiles === 'object') ? s.aiProfiles : {};
  const p = all[target] || {};
  if (p.nick) return p.nick; // 每个 AI 自己的昵称，不管当前切到谁
  if (target === 'all') return '聚合';
  return target === 'dsh' ? 'DeepSeek' : aiName(target);
}

/** 老的全局 AI 设置迁给 DeepSeek，别让主人之前的配置白丢 */
function migrateAiProfiles() {
  const s = loadSettings();
  if (s.aiProfiles && Object.keys(s.aiProfiles).length) return;
  const legacy = {};
  if (s.aiNick) legacy.nick = s.aiNick;
  if (s.aiAvatar) legacy.avatar = s.aiAvatar;
  if (s.aiColor) legacy.color = s.aiColor;
  if (s.aiSize) legacy.size = s.aiSize;
  if (s.bgImage) {
    legacy.bgImage = s.bgImage;
    legacy.bgScale = s.bgScale;
    legacy.bgX = s.bgX;
    legacy.bgY = s.bgY;
  }
  if (!Object.keys(legacy).length) return;
  saveSettings({ aiProfiles: { dsh: legacy } });
}

(function initImgViewer() {
  const viewer = document.getElementById('imgViewer');
  const vi = document.getElementById('imgViewerImg');
  const close = document.getElementById('imgViewerClose');
  if (!viewer || !vi) return;
  const chatEl2 = document.getElementById('chat');
  if (chatEl2) {
    chatEl2.addEventListener('click', (e) => {
      const img = e.target.closest('.bubble img');
      if (!img || img.closest('#imgViewer')) return;
      vi.src = img.src;
      viewer.classList.add('show');
    });
  }
  if (close) close.onclick = () => viewer.classList.remove('show');
  viewer.onclick = (e) => { if (e.target === viewer) viewer.classList.remove('show'); };

  // 保存图片：APK 里走原生桥写相册，浏览器/PWA 里走 blob 下载
  const saveBtn = document.getElementById('imgViewerSave');
  if (saveBtn) saveBtn.onclick = async () => {
    const src = vi.src;
    if (!src) return;
    if (saveBtn.disabled) return;

    const inApp = /TideCoveApp/.test(navigator.userAgent);
    const hasNative = !!(window.TideCoveNative && typeof window.TideCoveNative.saveImage === 'function');

    // 老版本 App 没有这个接口，别让它默默失败
    if (inApp && !hasNative) {
      tcToast('当前 App 版本太旧，保存不了。请装新版 TideCove', 4200);
      return;
    }

    const oldText = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';
    const reset = () => { saveBtn.disabled = false; saveBtn.textContent = oldText; };

    if (hasNative) {
      tcToast('正在保存…', 1200);
      try {
        const r = window.TideCoveNative.saveImage(src);
        if (r && typeof r === 'string' && r.indexOf('ERR') === 0) {
          tcToast('保存失败：' + r.slice(4), 3800);
          reset();
        } else {
          // 原生存完会回调 window.__tcSaveResult，这里只管兜底恢复按钮
          setTimeout(reset, 4000);
        }
      } catch (err) {
        tcToast('保存失败：' + (err && err.message ? err.message : err), 3800);
        reset();
      }
      return;
    }

    try {
      tcToast('正在保存…', 1200);
      const res = await fetch(src);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const ext = (blob.type || '').indexOf('png') >= 0 ? 'png' : 'jpg';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tidecove-' + Date.now() + '.' + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      tcToast('已保存到手机的下载目录', 2400);
    } catch (err) {
      tcToast('保存失败，已在新窗口打开，长按图片试试', 3800);
      window.open(src, '_blank');
    } finally {
      reset();
    }
  };
})();
